name: Deploy multi-gmail MCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          DO_USERNAME: ${{ secrets.DO_USERNAME }}
          DO_HOST: ${{ secrets.DO_HOST }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DO_USERNAME@$DO_HOST" bash << SSHEOF
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:\$PATH"

            DEPLOY_PATH="/var/www/mcp.brookwarner.com"

            if [ ! -d "\$DEPLOY_PATH/.git" ]; then
              echo "First deploy — cloning repository..."
              rm -rf "\$DEPLOY_PATH"
              git clone git@github.com:brookwarner/multi-gmail-tzak.git "\$DEPLOY_PATH"
            fi

            cd "\$DEPLOY_PATH"

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm install --ignore-scripts

            echo "Building..."
            npm run build

            echo "Starting PM2..."
            mkdir -p /var/data/multi-gmail
            SECRET_TOKEN="$SECRET_TOKEN" pm2 restart ecosystem.config.cjs --update-env || \
              SECRET_TOKEN="$SECRET_TOKEN" pm2 start ecosystem.config.cjs
            pm2 save

            echo "Done. Deployed commit: \$(git rev-parse --short HEAD)"
          SSHEOF

      - name: Verify deployment
        env:
          DO_USERNAME: ${{ secrets.DO_USERNAME }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DO_USERNAME@$DO_HOST" "
            for i in 1 2 3 4 5; do
              curl -sf http://localhost:8080/health && exit 0
              echo \"Attempt \$i failed, retrying in 3s...\"
              sleep 3
            done
            echo 'Health check failed after 5 attempts'
            exit 1
          "
