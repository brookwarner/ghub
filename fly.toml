# fly.toml app configuration file generated for multi-gmail-tzak on 2026-05-04T19:36:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'multi-gmail-tzak'
primary_region = 'iad'

[build]

[env]
  GMAILMCPCONFIG_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'gmail_config'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
